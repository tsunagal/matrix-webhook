version: "3.8"

services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: matrix-webhook:latest
    container_name: matrix_webhook
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
